<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shortcut Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: single narrow column — input on top, one big answer card, shortcut map below */
:root{
  --bg:#f6f5ef; --surface:#ffffff; --fg:#1d1c17; --muted:#6c6a5e; --line:#e3e0d3;
  --accent:#f2c200; --accent-ink:#1d1c17; --hi:#fff6cc;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14130f; --surface:#1f1e19; --fg:#f3f1e7; --muted:#a19e8f; --line:#33312a;
  --accent:#f5cc1a; --accent-ink:#14130f; --hi:#3a3216; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14130f; --surface:#1f1e19; --fg:#f3f1e7; --muted:#a19e8f; --line:#33312a;
  --accent:#f5cc1a; --accent-ink:#14130f; --hi:#3a3216; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px}
.wrap{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:20px 32px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;font-size:.92rem}
label.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.field{display:flex;flex-direction:column;gap:8px}
#name{font:600 1.5rem var(--body);padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);width:100%;box-sizing:border-box}
#name:focus{outline:none;border-color:var(--accent)}
.check{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--surface);border:2px solid var(--line);cursor:pointer;font-weight:600;user-select:none}
.check input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.check:has(input:checked){border-color:var(--accent);background:var(--hi)}
.check:focus-within{border-color:var(--accent)}
.answer{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;min-height:120px;justify-content:center}
.answer .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;opacity:.75}
.emojis{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.55);border-radius:14px;padding:8px 14px 8px 10px}
.chip .e{font-size:2.6rem;line-height:1}
.chip .t{font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1.1}
.chip .t small{display:block;font-family:var(--body);font-weight:500;font-size:.8rem;opacity:.75}
.plus{font-family:var(--display);font-weight:800;font-size:1.6rem}
.answer .msg{font-family:var(--display);font-weight:600;font-size:1.1rem}
.map{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.map h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0;padding:12px 16px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .e{font-size:1.7rem;line-height:1}
.row .r{font-family:var(--display);font-weight:600;font-size:1.05rem}
.row .n{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.row.on{background:var(--hi)}
.foot{color:var(--muted);font-size:.8rem;margin:0}
@media (prefers-reduced-motion:no-preference){.answer{transition:background .2s}}
</style>

<div class="wrap">
  <header>
    <h1>Kis shortcut mein daalu?</h1>
    <p class="sub">Naam ya pehla letter likho, emoji turant dikhega.</p>
  </header>

  <div class="field">
    <label class="lbl" for="name">Friend ka naam / initial</label>
    <input id="name" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" value="Rahul" placeholder="Jaise: Rahul ya R">
  </div>

  <label class="check" for="good"><input id="good" type="checkbox"> Good friend hai (🫶 mein bhi add karna)</label>

  <section class="answer" id="answer" aria-live="polite"></section>

  <section class="map">
    <h2>Tumhare shortcuts</h2>
    <div id="rows"></div>
  </section>

  <p class="foot">Gintee (members) screenshot ke time ki hai. Koi shortcut 190 ke paas pahunche to bata dena, range update kar dunga.</p>
</div>

<script>
const S=[
  {e:"🅰️",from:"A",to:"C",n:33},
  {e:"🏜️",from:"D",to:"J",n:46},
  {e:"🪁",from:"K",to:"M",n:45},
  {e:"👃",from:"N",to:"Q",n:33},
  {e:"®️",from:"R",to:"T",n:48},
  {e:"🦄",from:"U",to:"Z",n:25}
];
const GOOD={e:"🫶",n:57};
const $=id=>document.getElementById(id);
const rows=$("rows");
rows.innerHTML=S.map((s,i)=>`<div class="row" data-i="${i}"><span class="e">${s.e}</span><span class="r">${s.from} – ${s.to}</span><span class="n">${s.n}/200</span></div>`).join("")+
  `<div class="row" data-i="g"><span class="e">${GOOD.e}</span><span class="r">Good friends</span><span class="n">${GOOD.n}/200</span></div>`;

function chip(e,t,s){return `<div class="chip"><span class="e">${e}</span><span class="t">${t}<small>${s}</small></span></div>`}
function update(){
  const v=$("name").value.trim();
  const L=(v.match(/[a-z]/i)||[""])[0].toUpperCase();
  const good=$("good").checked;
  document.querySelectorAll(".row").forEach(r=>r.classList.remove("on"));
  const a=$("answer");
  if(!v){a.innerHTML=`<span class="k">Jawab</span><span class="msg">Upar naam likho.</span>`;return}
  if(!L){a.innerHTML=`<span class="k">Jawab</span><span class="msg">Naam English letter (A–Z) mein likho.</span>`;return}
  const i=S.findIndex(s=>L>=s.from&&L<=s.to);
  if(i<0){a.innerHTML=`<span class="k">Jawab</span><span class="msg">"${L}" ka koi shortcut nahi hai. Q wale naam bahut kam hote hain, inhe 👃 N–P mein daal do.</span>`;return}
  const s=S[i];
  document.querySelector(`.row[data-i="${i}"]`).classList.add("on");
  let html=chip(s.e,`${s.from}–${s.to}`,`"${L}" wala shortcut`);
  if(good){html+=`<span class="plus">+</span>`+chip(GOOD.e,"Good friends","dono mein add karo");document.querySelector('.row[data-i="g"]').classList.add("on")}
  a.innerHTML=`<span class="k">Isme add karo</span><div class="emojis">${html}</div>`;
}
$("name").addEventListener("input",update);
$("good").addEventListener("change",update);
update();
</script>

</body></html>
